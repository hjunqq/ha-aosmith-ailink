<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0055A5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003070;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFB300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE066;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="160" rx="20" ry="20" fill="url(#bg)" />

  <!-- Flame icon (left side, scaled down) -->
  <g transform="translate(20, 8) scale(0.55)">
    <path d="M128 48
      C128 48 105 72 105 100
      C105 108 108 115 113 120
      C110 113 113 104 118 100
      C118 118 124 125 124 138
      C124 148 118 155 110 158
      C115 145 114 136 110 128
      C106 140 108 158 115 168
      C105 162 98 150 98 136
      C98 110 115 88 128 68
      C141 88 158 110 158 136
      C158 150 151 162 141 168
      C148 158 150 140 146 128
      C142 136 141 145 146 158
      C138 155 132 148 132 138
      C132 125 138 118 138 100
      C143 104 146 113 143 120
      C148 115 151 108 151 100
      C151 72 128 48 128 48Z"
      fill="url(#flame)" opacity="0.95"/>
  </g>

  <!-- Divider line -->
  <line x1="148" y1="28" x2="148" y2="132" stroke="#4A90D9" stroke-width="1.5" opacity="0.6"/>

  <!-- Main title -->
  <text x="170" y="78"
    font-family="Arial, sans-serif"
    font-size="48"
    font-weight="700"
    fill="white"
    letter-spacing="1">AO Smith</text>

  <!-- Subtitle -->
  <text x="172" y="118"
    font-family="Arial, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#7EB8E8"
    letter-spacing="8">AiLink</text>

  <!-- HA badge -->
  <rect x="360" y="108" width="118" height="30" rx="6" fill="#1C3F6E" opacity="0.8"/>
  <text x="419" y="128"
    font-family="Arial, sans-serif"
    font-size="14"
    fill="#7EB8E8"
    text-anchor="middle"
    letter-spacing="1">Home Assistant</text>
</svg>
