ao_smith_room_comfort:
  alias: AO Smith Room Comfort
  mode: parallel
  max: 8
  sequence:
    - variables:
        system_mode: "{{ states('select.ao_smith_system_mode') }}"
    - if:
        - condition: template
          value_template: "{{ system_mode not in ['制冷', '采暖'] }}"
      then:
        - stop: 请先在全屋总控确认制冷或采暖
          error: true
    - action: climate.set_temperature
      target:
        entity_id: "{{ room }}"
      data:
        hvac_mode: "{{ 'cool' if system_mode == '制冷' else 'heat' }}"
        temperature: "{{ cooling_temperature if system_mode == '制冷' else heating_temperature }}"
