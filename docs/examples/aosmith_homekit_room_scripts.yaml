ao_smith_comfort_ke_ting:
  alias: 客厅舒适模式
  icon: mdi:home-thermometer
  sequence:
    - action: script.ao_smith_room_comfort
      data:
        room: climate.ke_ting
        cooling_temperature: 26
        heating_temperature: 22

ao_smith_floor_ke_ting:
  alias: 客厅切到地暖
  sequence:
    - action: climate.set_preset_mode
      target:
        entity_id: climate.ke_ting
      data:
        preset_mode: 地暖

